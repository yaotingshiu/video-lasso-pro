  const ua = navigator.userAgent;
  const BROWSER = /Edg\//.test(ua) ? 'edge' : /Firefox\//.test(ua) ? 'firefox' : 'chrome';

  // the extension passes its license in the #fragment (never sent to any server) so we can free the slot
  const frag = new URLSearchParams(location.hash.slice(1));
  const lic = { k: frag.get('k'), i: frag.get('i') };
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  let licState = '';

  // one big button for the browser in use, small ones for the others (ready for when Edge / Firefox go live)
  function renderStore() {
    const btn = document.getElementById('storeBtn');
    const url = STORES[BROWSER];
    document.getElementById('storeIco').innerHTML = LOGO(BROWSER);
    document.getElementById('storeTxt').textContent = url ? T('store', NAMES[BROWSER]) : T('soon', NAMES[BROWSER]);
    btn.classList.toggle('soon', !url);
    if (url) btn.href = url; else btn.removeAttribute('href');
    const box = document.getElementById('others');
    box.replaceChildren(T('other'));
    Object.keys(NAMES).filter((b) => b !== BROWSER).forEach((b) => {
      const el = document.createElement(STORES[b] ? 'a' : 'span');
      el.className = 'ob' + (STORES[b] ? '' : ' soon');
      if (STORES[b]) { el.href = STORES[b]; el.target = '_blank'; el.rel = 'noopener'; }
      el.innerHTML = LOGO(b);
      const n = document.createElement('span'); n.textContent = NAMES[b]; el.append(n);
      if (!STORES[b]) { const t = document.createElement('small'); t.textContent = T('soon_s'); el.append(t); }
      box.append(el);
    });
  }
  function renderLic() {
    if (!licState) return;
    const box = document.getElementById('lic');
    box.classList.remove('hidden', 'ok', 'bad');
    if (licState !== 'run') box.classList.add(licState);
    document.getElementById('licIc').innerHTML = licState === 'run' ? '<span class="spin"></span>' : licState === 'ok' ? '✓' : '!';
    document.getElementById('licT').textContent = T('lic_' + licState + '_t');
    document.getElementById('licP').innerHTML = T('lic_' + licState + '_p');
  }
  async function freeSlot() {
    if (!lic.k || !lic.i) return;
    licState = 'run'; renderLic();
    try {
      const r = await fetch('https://api.lemonsqueezy.com/v1/licenses/deactivate', {
        method: 'POST', headers: { Accept: 'application/json', 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ license_key: lic.k, instance_id: lic.i }).toString()
      });
      const j = await r.json().catch(() => null);
      // "instance_id not found" means it was already removed, which is also fine
      licState = (j && (j.deactivated || /instance/i.test(j.error || ''))) ? 'ok' : 'bad';
    } catch (e) { licState = 'bad'; }
    lic.k = lic.i = null;
    renderLic();
  }

  const pill = document.querySelector('.lang .pill');
  function movePill(instant) {
    const on = document.querySelector('.lang button.on'); if (!on) return;
    if (instant) pill.style.transition = 'none';
    pill.style.width = on.offsetWidth + 'px'; pill.style.transform = `translateX(${on.offsetLeft}px)`;
    if (instant) { void pill.offsetWidth; pill.style.transition = ''; }
  }
  function setLang(l, instant) {
    LANG = l;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T(el.dataset.t); });
    document.documentElement.lang = l === 'en' ? 'en' : (l === 'cn' ? 'zh-CN' : 'zh-TW');
    document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === l));
    document.getElementById('fbBtn').href = 'mailto:speed132454@gmail.com?subject=' + encodeURIComponent(T('mail_subject'));
    movePill(instant); renderStore(); renderLic();
    try { localStorage.setItem('lang', l); } catch (e) {}
  }
  document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => setLang(b.dataset.lang));
  let start = new URLSearchParams(location.search).get('lang');
  if (!start) { try { start = localStorage.getItem('lang'); } catch (e) {} }
  if (!start) { const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase(); start = /^zh/.test(nav) ? (/(cn|sg|hans)/.test(nav) ? 'cn' : 'zh') : 'en'; }
  setLang(['zh', 'cn', 'en'].includes(start) ? start : 'en', true);
  addEventListener('resize', () => movePill(true));
  if (document.fonts) document.fonts.ready.then(() => movePill(true));
  freeSlot();
</script>
</body>
</html>
