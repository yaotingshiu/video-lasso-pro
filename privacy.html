<style>
  :root { --bg: #0c0d10; --card: #15171c; --card2: #1c1f26; --line: rgba(var(--fg),.08); --line2: rgba(var(--fg),.15);
    --text: #f3f4f6; --sub: #9aa0aa; --gold: #f5c451; --spring: cubic-bezier(.34,1.56,.64,1); --ease: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.75; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(900px 520px at 15% -10%, rgba(245,196,81,.08), transparent 60%); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }
  .top { display: flex; align-items: center; gap: 10px; padding: 18px 0; }
  .home { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; border-radius: 12px; padding: 4px 8px 4px 4px; transition: background .2s; }
  .home:hover { background: rgba(var(--fg),.05); }
  .home svg { width: 34px; height: 34px; transition: transform .45s var(--spring); }
  .home:hover svg { transform: rotate(-8deg) scale(1.08); }
  .home b { font-size: 15px; }
  .sp { flex: 1; }
  .lang { position: relative; display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 3px; }
  .lang .pill { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 16px; background: var(--card2);
    box-shadow: inset 0 0 0 1px var(--line2); transition: transform .45s var(--spring), width .45s var(--spring); }
  .lang button { position: relative; z-index: 1; border: 0; background: none; color: var(--sub); font: 600 12px inherit; padding: 5px 11px; border-radius: 16px; cursor: pointer; }
  .lang button.on, .lang button:hover { color: var(--text); }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 36px 40px; margin: 20px 0 40px; transition: opacity .3s; }
  article.fade { opacity: 0; }
  article h1 { font-size: 30px; letter-spacing: -.4px; margin-bottom: 4px; }
  article h1 + p { color: var(--sub); font-size: 13px; margin-bottom: 18px; }
  article h2 { font-size: 18px; margin: 30px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
  article p { margin: 10px 0; color: var(--text2); }
  article ol, article ul { padding-left: 1.4em; color: var(--text2); }
  article li { margin: 6px 0; }
  article strong { color: var(--text); }
  article a { color: var(--gold); }
  .back { display: inline-flex; gap: 6px; color: var(--sub); text-decoration: none; font-weight: 700; font-size: 14px; margin-top: 6px; }
  .back:hover { color: var(--text); }
  footer a { color: var(--sub); text-decoration: none; } footer a:hover { color: var(--gold); }
  footer { text-align: center; color: var(--sub); font-size: 12px; padding: 0 0 40px; }
  @media (max-width: 640px) { article { padding: 26px 20px; } }

  /* ---------- light / dark ---------- */
  :root { --fg: 255,255,255; --text2: #d6d8dd; color-scheme: dark; }
  :root[data-theme="light"] { --fg: 20,24,32; color-scheme: light;
    --bg: #f4f5f8; --card: #ffffff; --card2: #eceef3; --line: rgba(20,24,32,.10); --line2: rgba(20,24,32,.20);
    --text: #14171c; --text2: #3a404b; --sub: #5b6371; --green: #0a72e0; --green2: #2b88ee;
    --gold: #b97d00; --gold2: #9a6600; --silver: #8b94a3; --silver2: #6f7888; }
  :root[data-theme="light"] .plan.silver .avg, :root[data-theme="light"] .silver .avg { color: #5d6675; }
  .theme-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--sub);
    display: grid; place-items: center; cursor: pointer; transition: color .2s, transform .35s var(--spring), border-color .2s; }
  .theme-btn:hover { color: var(--text); border-color: var(--line2); transform: rotate(-12deg) scale(1.06); }
  .theme-btn svg { width: 17px; height: 17px; }
  .theme-btn .moon { display: none; }
  :root[data-theme="light"] .theme-btn .sun { display: none; }
  :root[data-theme="light"] .theme-btn .moon { display: block; }
  body, .card, .plan, article, .lang, .theme-btn { transition: background-color .25s, color .25s, border-color .25s; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="./"><svg viewBox="10.5 8 112.5 112.5"> <defs> <clipPath id="ups"><rect x="-20" y="-40" width="180" height="106"/></clipPath> <clipPath id="dns"><rect x="-20" y="62" width="180" height="100"/></clipPath> <mask id="ms" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128"><rect width="128" height="128" fill="#fff"/><rect x="28.8" y="38.2" width="9.1" height="6.5" rx="1.5" fill="#000"/><rect x="28.8" y="83.3" width="9.1" height="6.5" rx="1.5" fill="#000"/><rect x="45.8" y="38.2" width="9.1" height="6.5" rx="1.5" fill="#000"/><rect x="45.8" y="83.3" width="9.1" height="6.5" rx="1.5" fill="#000"/><rect x="73.1" y="38.2" width="9.1" height="6.5" rx="1.5" fill="#000"/><rect x="73.1" y="83.3" width="9.1" height="6.5" rx="1.5" fill="#000"/><rect x="90.1" y="38.2" width="9.1" height="6.5" rx="1.5" fill="#000"/><rect x="90.1" y="83.3" width="9.1" height="6.5" rx="1.5" fill="#000"/><path d="M54.9 51.0 L54.9 77.0 L79.6 64 Z" fill="#000" stroke="#000" stroke-width="5.2" stroke-linejoin="round"/></mask> </defs> <g transform="rotate(-24 64 64)"><ellipse cx="64" cy="64" rx="50" ry="31" fill="none" stroke="#F2A900" stroke-width="8" clip-path="url(#ups)"/></g> <g transform="rotate(-8 64 64)"><rect x="21.0" y="33.0" width="86" height="62" rx="10.4" fill="currentColor" mask="url(#ms)"/></g> <g transform="rotate(-24 64 64)"><ellipse cx="64" cy="64" rx="50" ry="31" fill="none" stroke="#FFC83D" stroke-width="8" clip-path="url(#dns)"/><rect x="105" y="56" width="17" height="16" rx="5.5" fill="#FFB000" stroke="#B87400" stroke-width="2"/></g> <path d="M109 44 C122 52 119 72 104 80" fill="none" stroke="#FFC83D" stroke-width="7" stroke-linecap="round"/> </svg><b>Video Lasso</b></a>
    <span class="sp"></span>
    <button class="theme-btn" type="button" title="Light / Dark · 淺色 / 深色" aria-label="Theme"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg></button>
    <div class="lang"><span class="pill"></span><button data-lang="zh">繁中</button><button data-lang="cn">简中</button><button data-lang="en">EN</button></div>
  </div>
  <a class="back" href="./" id="backLink">← <span id="backText">返回方案頁</span></a>
  <article id="doc"><p style="color:var(--sub)">Loading…</p></article>
  <footer><div style="margin-bottom:6px"><a href="terms.html" id="fTerms">Terms</a> · <a href="privacy.html" id="fPriv">Privacy</a></div>© <span id="yr"></span> Video Lasso</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  const FILES = { zh: 'terms/privacy.zh-TW.md', cn: 'terms/privacy.zh-CN.md', en: 'terms/privacy.en.md' };
  const BACK = { zh: '返回方案頁', cn: '返回方案页', en: 'Back to plans' };
  const FT = { zh: '服務條款', cn: '服务条款', en: 'Terms of Service' }, FP = { zh: '隱私權政策', cn: '隐私政策', en: 'Privacy Policy' };
  const doc = document.getElementById('doc'), pill = document.querySelector('.lang .pill');
  function movePill(instant) {
    const on = document.querySelector('.lang button.on'); if (!on) return;
    if (instant) pill.style.transition = 'none';
    pill.style.width = on.offsetWidth + 'px'; pill.style.transform = `translateX(${on.offsetLeft}px)`;
    if (instant) { void pill.offsetWidth; pill.style.transition = ''; }
  }
  async function setLang(l, instant) {
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
    document.documentElement.lang = l === 'en' ? 'en' : (l === 'cn' ? 'zh-CN' : 'zh-TW');
    document.getElementById('backText').textContent = BACK[l];
    document.getElementById('fTerms').textContent = FT[l]; document.getElementById('fPriv').textContent = FP[l];
    document.querySelectorAll('footer a').forEach(a => a.href = a.getAttribute('href').split('?')[0] + '?lang=' + l);
    movePill(instant);
    try { localStorage.setItem('lang', l); } catch (e) {}
    doc.classList.add('fade');
    try {
      const md = await fetch(FILES[l], { cache: 'no-cache' }).then(r => { if (!r.ok) throw 0; return r.text(); });
      doc.innerHTML = marked.parse(md);
      doc.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    } catch (e) { doc.innerHTML = '<p>Failed to load. Please refresh.</p>'; }
    doc.classList.remove('fade');
  }
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  let start = new URLSearchParams(location.search).get('lang');
  if (!start) { try { start = localStorage.getItem('lang'); } catch (e) {} }
  if (!start) { const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase(); start = /^zh/.test(nav) ? (/(cn|sg|hans)/.test(nav) ? 'cn' : 'zh') : 'en'; }
  setLang(['zh', 'cn', 'en'].includes(start) ? start : 'en', true);
  addEventListener('resize', () => movePill(true));
</script>
<script>
(function(){var r=document.documentElement,mq=matchMedia('(prefers-color-scheme: light)');
function saved(){try{var v=localStorage.getItem('theme');return v==='light'||v==='dark'?v:null}catch(e){return null}}
if(mq.addEventListener)mq.addEventListener('change',function(){if(!saved())r.setAttribute('data-theme',mq.matches?'light':'dark')});
document.querySelectorAll('.theme-btn').forEach(function(b){b.onclick=function(){var n=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}}});
addEventListener('storage',function(e){if(e.key==='theme'&&(e.newValue==='light'||e.newValue==='dark'))r.setAttribute('data-theme',e.newValue)});})();
</script>
</body>
